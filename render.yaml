services:
  - type: web
    name: bling-bi
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: CLEAR_DATABASE_PASSWORD
        sync: false
      # Conexão com Supabase (PostgreSQL Gerenciado) ou banco Render
      - key: SUPABASE_DB_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bling-bi-db
          property: connectionString
      # Credenciais Bling opcionais via ambiente
      # - key: BLING_CLIENT_ID
      #   sync: false
      # - key: BLING_CLIENT_SECRET
      #   sync: false

# Banco de dados PostgreSQL gerenciado persistente gratuito no Render
databases:
  - name: bling-bi-db
    plan: free
    databaseName: bling_bi
    user: bling_admin

