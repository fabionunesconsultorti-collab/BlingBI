services:
  - type: web
    name: bling-bi
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: CLEAR_DATABASE_PASSWORD
        sync: false
      # Conexão opcional com PostgreSQL gerenciado do Render para o Master DB
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: bling-bi-db
      #     property: connectionString
      # Descomente e preencha caso queira conectar suas credenciais Bling via ambiente
      # - key: BLING_CLIENT_ID
      #   sync: false
      # - key: BLING_CLIENT_SECRET
      #   sync: false

