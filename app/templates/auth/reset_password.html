<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlingBI - Definir Nova Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bling_theme.css') }}">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #064e3b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            padding: 32px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h2 {
            font-size: 22px;
            color: #0f172a;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .header p {
            color: #64748b;
            font-size: 13.5px;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            height: 44px;
            padding: 10px 14px;
            font-size: 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            background: #f8fafc;
        }
        .form-input:focus {
            border-color: #008b54;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 139, 84, 0.15);
        }
        .btn-submit {
            width: 100%;
            height: 46px;
            background: #008b54;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            background: #007446;
        }
        .flash-msg {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13.5px;
        }
        .flash-danger { background: #fee2e2; color: #991b1b; }
        .flash-warning { background: #fef3c7; color: #92400e; }
        .flash-success { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div style="font-size: 32px; margin-bottom: 8px;">🔐</div>
            <h2>Criar Nova Senha</h2>
            <p>Cadastre sua nova senha de acesso.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-msg flash-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="new_password">Nova Senha (Mínimo 6 caracteres)</label>
                <input type="password" id="new_password" name="new_password" class="form-input" placeholder="••••••••" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirmar Nova Senha</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Salvar Nova Senha</button>
        </form>
    </div>
</body>
</html>
